services:
  pkpass-builder:
    image: ghcr.io/faolanbig/pkpass-builder-api-host:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-8000}:8000"
    environment:
      API_KEY: "${API_KEY:?Set API_KEY in your environment or .env file}"
      PKPASS_SIGNING_MODE: "${PKPASS_SIGNING_MODE:-unsigned}"
      PASS_TYPE_IDENTIFIER: "${PASS_TYPE_IDENTIFIER:-}"
      TEAM_IDENTIFIER: "${TEAM_IDENTIFIER:-}"
      ORGANIZATION_NAME: "${ORGANIZATION_NAME:-Contact Pass}"
      PASS_CERTIFICATE_PATH: "${PASS_CERTIFICATE_PATH:-/run/secrets/pass-certificate.pem}"
      PASS_PRIVATE_KEY_PATH: "${PASS_PRIVATE_KEY_PATH:-/run/secrets/pass-private-key.pem}"
      APPLE_WWDR_CERTIFICATE_PATH: "${APPLE_WWDR_CERTIFICATE_PATH:-/run/secrets/wwdr.pem}"
      GOOGLE_WALLET_ISSUER_ID: "${GOOGLE_WALLET_ISSUER_ID:-}"
      GOOGLE_WALLET_CLASS_ID: "${GOOGLE_WALLET_CLASS_ID:-}"
      GOOGLE_WALLET_SERVICE_ACCOUNT_JSON: "${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:-/run/secrets/google-wallet-service-account.json}"
      GOOGLE_WALLET_ORGANIZATION_NAME: "${GOOGLE_WALLET_ORGANIZATION_NAME:-Contact Pass}"
      GOOGLE_WALLET_ORIGINS: "${GOOGLE_WALLET_ORIGINS:-}"
    volumes:
      - "${CERTIFICATES_DIR:-./certificates}:/run/secrets:ro"
    restart: unless-stopped
