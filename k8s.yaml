apiVersion: v1
kind: Namespace
metadata:
  name: pkpass-gen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pkpass-gen
  namespace: pkpass-gen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pkpass-gen
  template:
    metadata:
      labels:
        app: pkpass-gen
    spec:
      containers:
        - name: pkpass-gen
          image: ghcr.io/faolanbig/pkpass-builder-api-host:v1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: pkpass-gen-api
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pkpass-gen
  namespace: pkpass-gen
spec:
  selector:
    app: pkpass-gen
  ports:
    - name: http
      port: 8443
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pkpass-gen
  namespace: pkpass-gen
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pkpass-gen.brave-cobra.vcluster.k8s.vector.int
      secretName: pkpass-gen-tls
  rules:
    - host: pkpass-gen.brave-cobra.vcluster.k8s.vector.int
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pkpass-gen
                port:
                  number: 8443
